name: Build Nizlo Remote for iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  build:
    needs: bridge
    runs-on: macos-15
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - name: Export cache access
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Select App Store Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          [[ $(xcrun --sdk iphoneos --show-sdk-version) == 26.* ]]

      - name: Install native build tools
        run: brew install nasm yasm

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Apply upstream Flutter compatibility patch
        run: |
          cd "$(dirname "$(dirname "$(command -v flutter)")")"
          git apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.81'
          targets: aarch64-apple-ios
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: nizlo-ios-aarch64

      - name: Install native libraries
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          doNotCache: false

      - name: Resolve iOS libraries
        run: $VCPKG_ROOT/vcpkg install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"

      - name: Restore Flutter bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build remote protocol library
        run: cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Build unsigned iOS viewer archive
        run: |
          cd flutter
          flutter build ipa --release --no-codesign --build-name 1.0.0 --build-number 1
          archive=build/ios/archive/Runner.xcarchive
          app="$archive/Products/Applications/Runner.app"
          test -d "$archive"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.nizlo.remote.ios
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 1.0.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 1
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Info.plist")" = nizlo-remote
          ditto -c -k --sequesterRsrc --keepParent "$app" ../NizloRemote-ios-unsigned.zip
          ditto -c -k --sequesterRsrc --keepParent "$archive" ../NizloRemote-ios-unsigned-archive.zip

      - name: Upload unsigned viewer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nizlo-remote-ios-unsigned
          path: |
            NizloRemote-ios-unsigned.zip
            NizloRemote-ios-unsigned-archive.zip
